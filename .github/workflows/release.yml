name: Release

on:
  push:
    # Not 'v*', which would also match the vsix-* tags the VSCode
    # extension workflow creates
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish'
        required: true

permissions:
  contents: write

# SDL 2 declares cmake_minimum_required(VERSION 3.0.0), which CMake 4 refuses
# to configure. sdl2-sys drives cmake itself, so there is nowhere to pass
# -DCMAKE_POLICY_VERSION_MINIMUM; cmake reads it from the environment instead.
# Older cmake ignores it, so this is safe on every runner.
env:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  # Built once here rather than pulled from the vsix-* releases the extension
  # workflow publishes: those track pushes to main, so a release tagged right
  # after a grammar change would silently bundle the previous extension.
  # Packaging from the tagged tree keeps the two in step by construction.
  vsix:
    name: Build the VSCode extension
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - uses: actions/setup-node@v5
      with:
        node-version: '>=20.x.x'

    # Unversioned, so the install scripts don't have to know the version
    - name: Package
      run: |
        cd plush.tmbundle
        npx --yes @vscode/vsce package --allow-missing-repository --out ../plush.vsix

    - uses: actions/upload-artifact@v4
      with:
        name: vsix
        path: plush.vsix
        if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    needs: vsix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: plush-x86_64-linux
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: plush-aarch64-linux
          # macos-13 is retired; macos-15-intel is the current Intel runner
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: plush-x86_64-macos
          - os: macos-14
            target: aarch64-apple-darwin
            asset: plush-aarch64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: plush-x86_64-windows

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # SDL is compiled from source here, so it needs the dev headers for
    # every backend it should support. Without these it configures itself
    # with no video or audio driver and fails only at runtime.
    - name: Install SDL build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y --no-install-recommends \
          cmake \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
          libxfixes-dev libxss-dev \
          libwayland-dev wayland-protocols libxkbcommon-dev \
          libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

    # Oldest macOS we support. Must stay above 11.3: SDL's joystick code has
    # an "@available(macOS 11.3)" check, and below that floor clang emits a
    # runtime __isPlatformVersionAtLeast call that lives in compiler-rt, which
    # rustc's -nodefaultlibs then keeps out of the link.
    - name: Set macOS deployment target
      if: runner.os == 'macOS'
      run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

    - name: Build
      run: cargo build --release --locked --features static-sdl --target ${{ matrix.target }}

    # Only checks that the binary starts and runs code. The runners are
    # headless, so this does not exercise the SDL video path.
    - name: Smoke test
      run: cargo run --release --locked --features static-sdl --target ${{ matrix.target }} -- --eval '$println("ok");'

    - uses: actions/download-artifact@v4
      with:
        name: vsix

    # Layout matches what the installer drops into ~/.plush. The extension
    # and its installer ride along so that installing it afterwards is one
    # command and needs no network access or Node.js.
    - name: Package
      if: runner.os != 'Windows'
      run: |
        root="dist/${{ matrix.asset }}"
        mkdir -p "$root/bin"
        cp "target/${{ matrix.target }}/release/plush" "$root/bin/"
        cp README.md LICENSE "$root/"
        cp -r examples "$root/examples"
        cp plush.vsix "$root/"
        cp plush.tmbundle/install_vsix.sh "$root/"
        chmod +x "$root/install_vsix.sh"
        tar -czf "${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"

    - name: Package
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $root = "dist/${{ matrix.asset }}"
        New-Item -ItemType Directory -Force -Path "$root/bin" | Out-Null
        Copy-Item "target/${{ matrix.target }}/release/plush.exe" "$root/bin/"
        Copy-Item README.md, LICENSE "$root/"
        Copy-Item -Recurse examples "$root/examples"
        Copy-Item plush.vsix "$root/"
        Copy-Item plush.tmbundle/install_vsix.ps1 "$root/"
        Compress-Archive -Path $root -DestinationPath "${{ matrix.asset }}.zip"

    # Each runner produces one of these two. if-no-files-found only fires
    # when neither pattern matches, so listing both is safe.
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}
        path: |
          ${{ matrix.asset }}.tar.gz
          ${{ matrix.asset }}.zip
        if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    # Everything the build jobs produced, plus the plush.vsix the vsix job
    # uploaded. That one is already inside each archive; publishing it
    # loose as well gives people a direct download for the extension.
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    # Mirror of the copies served from GitHub Pages, so the installers are
    # also reachable at releases/latest/download/install
    - name: Include the install scripts
      run: cp pages/install pages/install.ps1 dist/

    - name: Generate checksums
      working-directory: dist
      run: sha256sum * > SHA256SUMS

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag || github.ref_name }}
      # Create-or-update, so a re-run after a partial failure replaces the
      # assets instead of failing on an existing release
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists, replacing its assets"
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" --title "$TAG" --generate-notes dist/*
        fi

  # Restamp the website with the version just published. Called directly
  # rather than relying on the release event, which GitHub does not raise
  # for releases created with the default GITHUB_TOKEN.
  pages:
    name: Update the website
    needs: publish
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
