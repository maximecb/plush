name: Run tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
          toolchain: stable

    - name: Install SDL2
      run: |
        sudo add-apt-repository -y "deb http://archive.ubuntu.com/ubuntu `lsb_release -sc` main universe restricted multiverse"
        sudo apt-get update -y -qq
        sudo apt-get install libsdl2-dev

    - name: Build VM
      run: cargo build

    - name: Release build
      run: cargo build --release

    # Both profiles get tested: they differ in more than optimization
    # level, and release is the one that ships
    - name: Test VM (debug)
      run: RUST_BACKTRACE=1 cargo test

    - name: Test VM (release)
      run: RUST_BACKTRACE=1 cargo test --release

    - name: Test plush command-line arguments
      working-directory: .
      run: |
        cargo run tests/empty.psh
        cargo run tests/fact.psh
        cargo run -- --no-exec examples/raytracer.psh
        cargo run -- --eval ''
        cargo run -- --eval '$println(1);'
        cargo run examples/command_args.psh
        cargo run examples/command_args.psh foo bar

    # We do this to verify that the benchmarks can all run without crashing
    # The benchmarks are designed to run fairly quickly, less than 5 seconds each
    #
    # They collect several times more than the test suite does, so they run
    # with verify_gc, which walks and checks the heap after every GC cycle
    - name: Run benchmarks
      run: |
        cargo build --release --features verify_gc --target-dir target/verify_gc
        for f in benchmarks/*.psh; do
          echo "Running benchmark: $f"
          ./target/verify_gc/release/plush "$f"
        done

    # The parser benchmark is generated instead of checked in, because the file
    # it produces is some 30 MB. Generate it here and run it, to verify that the
    # generator still produces a program the VM accepts.
    - name: Generate and run the parser benchmark
      run: |
        python3 benchmarks/gen_parse_bench.py -o "$RUNNER_TEMP/parse_bench.psh"

        # This is the mode the benchmark exists to measure: parse and compile
        # every function, without running any of them
        ./target/release/plush --no-exec "$RUNNER_TEMP/parse_bench.psh"

        ./target/release/plush "$RUNNER_TEMP/parse_bench.psh" | tee "$RUNNER_TEMP/out.txt"
        grep -qx done "$RUNNER_TEMP/out.txt"
