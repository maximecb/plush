name: Run tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
          toolchain: stable

    - name: Install SDL2
      run: |
        sudo add-apt-repository -y "deb http://archive.ubuntu.com/ubuntu `lsb_release -sc` main universe restricted multiverse"
        sudo apt-get update -y -qq
        sudo apt-get install libsdl2-dev

    - name: Build VM
      run: cargo build

    - name: Release build
      run: cargo build --release

    # Both profiles get tested: they differ in more than optimization
    # level, and release is the one that ships
    - name: Test VM (debug)
      run: RUST_BACKTRACE=1 cargo test

    - name: Test VM (release)
      run: RUST_BACKTRACE=1 cargo test --release

    - name: Test plush command-line arguments
      working-directory: .
      run: |
        cargo run tests/empty.psh
        cargo run tests/fact.psh
        cargo run -- --no-exec examples/raytracer.psh
        cargo run -- --eval ''
        cargo run -- --eval '$println(1);'
        cargo run examples/command_args.psh
        cargo run examples/command_args.psh foo bar

    # We do this to verify that the benchmarks can all run without crashing
    # The benchmarks are designed to run fairly quickly, less than 5 seconds each
    #
    # They collect several times more than the test suite does, so they run
    # with verify_gc, which walks and checks the heap after every GC cycle
    - name: Run benchmarks
      run: |
        cargo build --release --features verify_gc --target-dir target/verify_gc
        for f in benchmarks/*.psh; do
          echo "Running benchmark: $f"
          ./target/verify_gc/release/plush "$f"
        done

    # The parser benchmark is generated instead of checked in, because the file
    # it produces is some 30 MB. Generate it here and run it, to verify that the
    # generator still produces a program the VM accepts.
    - name: Generate and run the parser benchmark
      run: |
        python3 benchmarks/gen_parse_bench.py -o "$RUNNER_TEMP/parse_bench.psh"

        # This is the mode the benchmark exists to measure: parse and compile
        # every function, without running any of them
        ./target/release/plush --no-exec "$RUNNER_TEMP/parse_bench.psh"

        ./target/release/plush "$RUNNER_TEMP/parse_bench.psh" | tee "$RUNNER_TEMP/out.txt"
        grep -qx done "$RUNNER_TEMP/out.txt"

  # Windows has no mmap: the allocator reserves and commits address space
  # through VirtualAlloc there, and this job is the only place that code
  # gets compiled and run.
  test-windows:
    runs-on: windows-latest

    # SDL 2 declares cmake_minimum_required(VERSION 3.0.0), which CMake 4
    # refuses to configure. sdl2-sys drives cmake itself, so there is
    # nowhere to pass -DCMAKE_POLICY_VERSION_MINIMUM; cmake reads it from
    # the environment instead.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      RUST_BACKTRACE: '1'

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    # SDL is built from source and linked in, so the runner needs no
    # prebuilt SDL2 to be installed. This is also what the release build
    # does, so it covers that link on Windows as well.
    #
    # Only the release profile is built. Building SDL twice would double
    # the slowest part of this job, and release is what ships.
    - name: Build VM
      run: cargo build --release --features static-sdl

    # The test harness builds its own interpreter with verify_gc, into
    # target/verify_gc, and runs every test program through it
    - name: Test VM (release)
      run: cargo test --release --features static-sdl

    # Run under bash, as the Linux job does. The default shell here is
    # pwsh, which only reports the exit status of the last command in a
    # block, so a failure in the middle would go unnoticed.
    - name: Test plush command-line arguments
      shell: bash
      run: |
        ./target/release/plush.exe tests/fact.psh
        ./target/release/plush.exe --eval '$println(1);'
        ./target/release/plush.exe --no-exec examples/raytracer.psh

    # The GC benchmarks are what put the allocator under real pressure:
    # they grow the heap, collect repeatedly, and make the collector
    # re-reserve its to-space. Run through the verify_gc build the test
    # harness already produced, so the heap is walked and checked after
    # every cycle.
    - name: Run the GC benchmarks
      shell: bash
      run: |
        for f in benchmarks/gc_*.psh; do
          echo "Running benchmark: $f"
          ./target/verify_gc/release/plush.exe "$f"
        done
