name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  # Called by release.yml once a release is published, so the version shown
  # on the page follows the newest release
  workflow_call:
  # Only fires for releases published by hand: GitHub suppresses events
  # raised by workflows using the default GITHUB_TOKEN
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let an in-flight one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/configure-pages@v5

    # Stamp the newest release into the page. Only v<number> tags count, so a
    # vsix-* extension release never becomes the advertised plush version.
    - name: Set the version shown on the page
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="$(gh api 'repos/{owner}/{repo}/releases?per_page=30' \
          --jq '[.[] | select(.tag_name | test("^v[0-9]")) | .tag_name] | first')"
        version="${version#v}"

        if [ -z "$version" ] || [ "$version" = null ]; then
          echo "No plush release found, dropping the version from the heading"
          sed -i 's| <span class="version">__PLUSH_VERSION__</span>||' pages/index.html
        else
          echo "Advertising version $version"
          sed -i "s|__PLUSH_VERSION__|$version|" pages/index.html
        fi

        grep -o '<h2>Install Plush[^<]*\(<span[^>]*>[^<]*</span>\)\?' pages/index.html

    # Deploying from Actions lets us serve any directory. Branch-based
    # Pages only supports the repo root or /docs.
    - uses: actions/upload-pages-artifact@v3
      with:
        path: pages

    - id: deploy
      uses: actions/deploy-pages@v4
