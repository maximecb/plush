name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let an in-flight one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/configure-pages@v5

    # Deploying from Actions lets us serve any directory. Branch-based
    # Pages only supports the repo root or /docs.
    - uses: actions/upload-pages-artifact@v3
      with:
        path: pages

    - id: deploy
      uses: actions/deploy-pages@v4
