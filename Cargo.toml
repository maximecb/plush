# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "plush"
version = "0.6.5"
edition = "2021"

[dependencies]
sdl2 = "0.38.0"     # needed for graphics and sound
rustc-hash = "2.1.1" # for faster hash maps

# The allocator reserves address space and commits it on demand. That is
# mmap/mprotect on POSIX, and VirtualAlloc/VirtualFree on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[features]
verify_gc = []  # walk and check the heap after each GC cycle
log_gc = []     # report each GC cycle on stdout

# Build SDL from source and link it into the binary. Used for release
# builds so the shipped executable has no libSDL2 dependency. Off by
# default because it makes a clean build much slower.
static-sdl = ["sdl2/bundled", "sdl2/static-link"]

[profile.dev]
debug = true
opt-level = 3
overflow-checks = true
debug-assertions = true

[profile.release]
debug = false
# Enable all optimizations for maximum performance
opt-level = 3
codegen-units = 1
lto = true
# Overflow checks stay on in release for security reasons: the VM does
# unchecked size arithmetic that would under-allocate if it wrapped.
# Debug assertions are off: they restate invariants the interpreter
# already enforces with live checks, and cost ~5-8% on hot benchmarks.
# Invariants worth keeping in release use plain assert! instead.
overflow-checks = true
debug-assertions = false
